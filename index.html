<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>

    <div class="header">
        <h2><a href="#"></a>Home</h2>
        <h1>Rock, Paper, Scissors</h1>
    </div>

    <div class="main">
        <div class="button-box">
            <div class="rock-box">
                <button id="rock">Rock</button>
            </div>
            <div class="paper-scissors-box">
                <button id="paper">Paper</button>
                <button id="scissors">Scissors</button>
            </div>
        </div>
        <div class="gif">
            <div></div>
        </div>
        <div class="button-box">
            <div class="paper-scissors-box">
                <button id="paper-computer">Paper</button>
                <button id="scissors-computer">Scissors</button>
            </div>
            <div class="rock-box">
                <button id="rock-computer">Rock</button>
            </div>
        </div>
    </div>

    <div class="results-container">
        <ul id="results">
            <li id="user">User score:<p id="user-score"></p></li>
            <li id="computer">Computer score:<p id="computer-score"></p></li>
            <li id="draw">Draws:<p id="draw-score"></p></li>
        </ul>
    </div>

    <div class="footer">
        <div class="footer-text">FOOTER</div>
    </div>
    
</body>
</html>
