<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>

    <div class="header">

        <h2 class="left-header"><a href="github.com">Home</a></h2>

        <h1>Rock, Paper, Scissors</h1>

        <div class="right-header">
                <h2><a href="https://github.com/OllieWP634">OllieWP634</a></h2>
                <a href="https://github.com/OllieWP634"><img src="../images/github.png" alt="Github logo"></a>
        </div>

    </div>

    <div class="description">
        <div class="description-box">
            <h3>----- 5 rounds to beat the computer -----</h3>
            <p>Rock beats Scissors</p>
            <p>Paper beats Rock</p>
            <p>Scissors beats Paper</p>
        </div>
    </div>

    <div class="main">
        <div class="button-box">
            <div class="rock-box">
                <button id="rock" id="home"><img class="image_on" src="../images/rock.jpg" alt="Image of cartoon rock"><img class="image_off" src="../images/rock.gif" alt="GIF of cartoon rock"></button>
            </div>
            <div class="paper-scissors-box">
                <button id="paper" id="home"><img class="image_on" src="../images/paper.jpg" alt="Image of cartoon paper"><img class="image_off" src="../images/paper.gif" alt="GIF of cartoon paper"></button>
                <button id="scissors" id="home"><img class="image_on" src="../images/scissors.jpg" alt="Image of cartoon scissors"><img class="image_off" src="../images/scissors.gif" alt="GIF of cartoon scissors"></button>
            </div>
        </div>
        <div class="gif">
            <div></div>
        </div>
        <div class="button-box">
            <div class="paper-scissors-box">
                <button id="paper-computer"><img src="../images/paper.jpg"></button>
                <button id="scissors-computer"><img src="../images/scissors.jpg"></button>
            </div>
            <div class="rock-box">
                <button id="rock-computer"><img src="../images/rock.jpg"></button>
            </div>
        </div>
    </div>

    <div class="results-container">
        <div class="user">
            <li id="user">User score</li>
            <p id="user-score"></p>
        </div>
        <div class="draw">
            <li id="draw">Draws</li>
            <p id="draw-score"></p>
        </div>
        <div class="computer">
            <li id="computer">Computer score</li>
            <p id="computer-score"></p>
        </div>
    </div>

    <div class="footer">
        <div class="footer-text">FOUNDATIONS</div>
    </div>
    
</body>
</html>
