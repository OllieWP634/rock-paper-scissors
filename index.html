<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>

    <div class="header">
        <h2><a href="#">Home</a></h2>
        <h1>Rock, Paper, Scissors</h1>
        <h2><a href="#"></a>OllieWP634</h2>
    </div>

    <div class="main">
        <div class="button-box">
            <div class="rock-box">
                <button id="rock">Rock</button>
            </div>
            <div class="paper-scissors-box">
                <button id="paper">Paper</button>
                <button id="scissors">Scissors</button>
            </div>
        </div>
        <div class="gif">
            <div></div>
        </div>
        <div class="button-box">
            <div class="paper-scissors-box">
                <button id="paper-computer">Paper</button>
                <button id="scissors-computer">Scissors</button>
            </div>
            <div class="rock-box">
                <button id="rock-computer">Rock</button>
            </div>
        </div>
    </div>

    <div class="results-container">
        <div class="results">
            <div class="user">
                <li id="user">User score:
                <p id="user-score"></p>
            </li>
            </div>
            <div class="computer">
                <li id="computer">Computer score:
                <p id="computer-score"></p>
            </li>
            </div>
            <div class="draw">
                <li id="draw">Draws:
                <p id="draw-score"></p>
            </li>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-text">THE ODIN PROJECT</div>
    </div>
    
</body>
</html>
