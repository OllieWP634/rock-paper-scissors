<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>

    <div class="header">
        <h2><a href="#">Home</a></h2>
        <h1>Rock, Paper, Scissors</h1>
        <h2><a href="#"></a>OllieWP634</h2>
    </div>

    <div class="description">
        <div class="image1">

        </div>
        <div class="description-box">
            <h3>----- 5 rounds to beat the computer -----</h3>
            <p>Rock beats Scissors</p>
            <p>Paper beats Rock</p>
            <p>Scissors beats Paper</p>
        </div>
        <div class="image2">

        </div>
    </div>

    <div class="main">
        <div class="button-box">
            <div class="rock-box">
                <button id="rock"><img src="../images/rock.jpg"></button>
            </div>
            <div class="paper-scissors-box">
                <button id="paper"><img src="../images/paper.jpg"></button>
                <button id="scissors"><img src="../images/scissors.jpg"></button>
            </div>
        </div>
        <div class="gif">
            <div></div>
        </div>
        <div class="button-box">
            <div class="paper-scissors-box">
                <button id="paper-computer"><img src="../images/paper.jpg"></button>
                <button id="scissors-computer"><img src="../images/scissors.jpg"></button>
            </div>
            <div class="rock-box">
                <button id="rock-computer"><img src="../images/rock.jpg"></button>
            </div>
        </div>
    </div>

    <div class="results-container">
        <div class="user">
            <li id="user">User score</li>
            <p id="user-score"></p>
        </div>
        <div class="draw">
            <li id="draw">Draws</li>
            <p id="draw-score"></p>
        </div>
        <div class="computer">
            <li id="computer">Computer score</li>
            <p id="computer-score"></p>
        </div>
    </div>

    <div class="footer">
        <div class="footer-text">FOUNDATIONS</div>
    </div>
    
</body>
</html>
