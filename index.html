<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="javascript.js" defer></script>
</head>
<body>

    <div>
        <h2><a href="#"></a>Home</h2>
        <h1>Rock, Paper, Scissors</h1>
    </div>

    <div class="main">
        <h2 class="main-text">ROCK PAPER SCISSORS</h2>
    </div>

    <div class="main-game">
        <div class="user-box">
            <button id="rock">Rock</button>
            <button id="paper">Paper</button>
            <button id="scissors">Scissors</button>
        </div>
        <div class="gif">
            <img>
        </div>
        <div class="computer-box">
        </div>
    </div>
    
    <div class="results-container">
        <ul id="results">
            <li id="user">User score:<p id="user-score"></p></li>
            <li id="computer">Computer score:<p id="computer-score"></p></li>
            <li id="draw">Draws:<p id="draw-score"></p></li>
        </ul>
    </div>
    
</body>
</html>
